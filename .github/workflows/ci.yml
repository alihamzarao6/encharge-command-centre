name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  checks:
    name: typecheck · lint · gitleaks · tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history — gitleaks scans every commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24 (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint + prettier --check)
        run: npm run lint

      - name: Install gitleaks (pinned binary — no licence dependency)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks — full git history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .

      - name: gitleaks — working tree (catches anything untracked-but-present)
        run: gitleaks dir --redact --no-banner --config .gitleaks.toml .

      - name: Unit tests with coverage gate (80% lines / 75% branches — vitest fails below)
        run: npm run test:unit

      # Stage 2 part 6 (FND-250): the browser bundle must carry no service role key, no
      # Anthropic key and no fragment of the voice prompt (SECURITY §2, TASKS 2.6.3). The
      # values are placeholders — the check is on shapes and on the voice sentences.
      - name: Build the web app
        run: npm run web:build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Grep the built bundle for secrets and the voice prompt
        run: npm run web:check

      - name: Bundle the Edge Function (esbuild) — the deployable entrypoint must build
        run: npm run functions:bundle

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total;console.log('lines',s.lines.pct+'%','branches',s.branches.pct+'%','functions',s.functions.pct+'%','statements',s.statements.pct+'%')"
          fi

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Stage 2 part 2 (FND-210): the database proven from zero on every push. Stage 3 adds
  # `npm run n8n:validate` in the same commit as the first workflow (TESTING.md §8).
  integration:
    name: supabase local · migrations from zero · schema + RLS suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Missing stack env is a loud failure here, never a silent skip (tests/helpers).
      REQUIRE_SUPABASE_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Supabase CLI (pinned to the devDependency version)
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Bundle the Edge Function so the stack can load it (TASKS 2.6.3)
        run: npm run functions:bundle

      - name: Start Supabase local stack
        run: supabase start

      - name: Replay schema from zero (migrations + seed) — the from-zero acceptance check
        run: supabase db reset --local

      - name: Export stack credentials for the test suites (local throwaway keys, not secrets)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Integration suite (schema from zero, seed, triggers, constraints)
        run: npm run test:int

      - name: 'Security suite (RLS: anon zero rows, allowlist, memory scoping)'
        run: npm run test:security

  # Stage 2 part 6 (FND-250): the interface, in a real browser, at 375 / 768 / 1280, against
  # a scripted Supabase (tests/e2e/mock.ts) — no stack, no key, no spend. Proves the
  # error states (402, empty reply, 401 mid-turn, deactivated), copy-to-clipboard and the
  # no-horizontal-scroll rule; refreshes the screenshots as an artefact.
  browser:
    name: web build · playwright at 375 / 768 / 1280
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Chrome for Playwright (the suite runs on the `chrome` channel)
        run: npx playwright install --with-deps chrome

      - name: Browser suite
        run: npm run test:e2e

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-2-screenshots
          path: |
            docs/assets/stage-2/*.png
            tests/e2e/.output/**/trace.zip
          if-no-files-found: ignore
